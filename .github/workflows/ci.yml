name: CI/CD Deploy to Elastic Beanstalk

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # 3️⃣ Install EB CLI
      - name: Install EB CLI
        run: |
          python -m pip install --upgrade pip
          pip install awsebcli

      # 4️⃣ Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      # 5️⃣ Verify EB config exists (debug safety)
      - name: Verify EB config
        run: |
          if [ ! -f .elasticbeanstalk/ci.yml ]; then
            echo "❌ Missing .elasticbeanstalk/ci.yml"
            exit 1
          fi

      # 6️⃣ Deploy
      - name: Deploy to Elastic Beanstalk
        run: |
          eb deploy stockanalysis-env --region us-east-1